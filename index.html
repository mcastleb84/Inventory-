

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#123c4a">

<title>Inventory</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  font-family: Arial, sans-serif;

  background: #edf2f4;

  color: #203640;

}

header {

  background: #123c4a;

  color: white;

  padding: 24px 18px;

  text-align: center;

}

header h1 {

  margin: 0;

  font-size: 30px;

}

header p {

  margin-bottom: 0;

  color: #d0e7eb;

}

.container {

  max-width: 850px;

  margin: auto;

  padding: 16px;

}

.card {

  background: white;

  padding: 18px;

  margin-bottom: 16px;

  border-radius: 12px;

  box-shadow: 0 2px 8px #00000012;

}

h2 {

  font-size: 19px;

  margin-top: 0;

}

.stats {

  display: grid;

  grid-template-columns: repeat(3, 1fr);

  gap: 10px;

  margin-bottom: 16px;

}

.stat {

  background: white;

  border-radius: 12px;

  padding: 14px 8px;

  text-align: center;

}

.stat strong {

  display: block;

  color: #087b89;

  font-size: 23px;

  margin-bottom: 6px;

}

.stat span {

  font-size: 12px;

}

label {

  display: block;

  font-weight: bold;

  margin: 12px 0 6px;

  font-size: 14px;

}

input, textarea {

  width: 100%;

  padding: 12px;

  border: 1px solid #ccd7dc;

  border-radius: 8px;

  font-size: 16px;

  font-family: inherit;

}

textarea {

  min-height: 80px;

  resize: vertical;

}

button {

  border: none;

  border-radius: 8px;

  padding: 11px 15px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

}

.primary {

  background: #087b89;

  color: white;

}

.secondary {

  background: #e1ecef;

  color: #123c4a;

}

.danger {

  background: #b73535;

  color: white;

}

.full {

  width: 100%;

  margin-top: 14px;

}

.form-row {

  display: grid;

  grid-template-columns: 2fr 1fr;

  gap: 12px;

}

.inventory-item {

  padding: 14px 0;

  border-bottom: 1px solid #e5ebee;

}

.item-top {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 10px;

}

.item-name {

  background: none;

  color: #087b89;

  text-decoration: underline;

  text-align: left;

  padding: 5px 0;

  font-size: 17px;

  overflow-wrap: anywhere;

}

.quantity-controls {

  display: flex;

  align-items: center;

  gap: 9px;

}

.quantity-controls button {

  padding: 8px 12px;

  background: #e1ecef;

  color: #123c4a;

  font-size: 18px;

}

.item-details {

  color: #657680;

  font-size: 13px;

  margin-top: 8px;

}

.profile-actions {

  display: flex;

  gap: 10px;

  margin-top: 18px;

}

.profile-actions button {

  flex: 1;

}

.hidden {

  display: none;

}

.empty {

  text-align: center;

  color: #71818a;

  padding: 20px;

}

footer {

  text-align: center;

  padding: 20px;

  font-size: 12px;

  color: #74838b;

}

@media(max-width: 480px) {

  .stats {

    gap: 6px;

  }

  .stat strong {

    font-size: 20px;

  }

  .container {

    padding: 12px;

  }

  .profile-actions {

    flex-direction: column;

  }

}

</style>

</head>

<body>

<header>

  <h1>Inventory</h1>

  <p>Keep your items organized and accounted for.</p>

</header>

<main class="container">

  <!-- DASHBOARD -->

  <section id="dashboard">

    <div class="stats">

      <div class="stat">

        <strong id="totalItems">0</strong>

        <span>Unique Items</span>

      </div>

      <div class="stat">

        <strong id="totalUnits">0</strong>

        <span>Total Units</span>

      </div>

      <div class="stat">

        <strong id="totalValue">$0.00</strong>

        <span>Stock Value</span>

      </div>

    </div>

    <!-- ADD INVENTORY -->

    <div class="card">

      <h2>Add Inventory</h2>

      <form id="addForm">

        <div class="form-row">

          <div>

            <label for="newName">Inventory Name</label>

            <input

              id="newName"

              type="text"

              placeholder="Example: Shampoo"

              required

            >

          </div>

          <div>

            <label for="newQuantity">Quantity</label>

            <input

              id="newQuantity"

              type="number"

              min="0"

              step="1"

              value="1"

              required

            >

          </div>

        </div>

        <button class="primary full" type="submit">

          + Add Inventory

        </button>

      </form>

    </div>

    <!-- INVENTORY LIST -->

    <div class="card">

      <h2>Inventory List</h2>

      <input

        id="searchInput"

        type="search"

        placeholder="Search inventory..."

      >

      <div id="inventoryList"></div>

    </div>

  </section>

  <!-- ITEM PROFILE -->

  <section id="profilePage" class="hidden">

    <button

      class="secondary"

      type="button"

      onclick="showDashboard()"

    >

      ← Back to Inventory

    </button>

    <div class="card" style="margin-top:16px">

      <h2>Inventory Profile</h2>

      <form id="profileForm">

        <label for="profileName">Inventory Name</label>

        <input id="profileName" required>

        <label for="profileQuantity">Current Quantity</label>

        <input

          id="profileQuantity"

          type="number"

          min="0"

          step="1"

          required

        >

        <label for="purchaseDate">Date Purchased</label>

        <input id="purchaseDate" type="date">

        <label for="purchaseStore">

          Where Was It Purchased?

        </label>

        <input

          id="purchaseStore"

          placeholder="Store or supplier name"

        >

        <label for="purchaseCost">

          Cost Per Unit ($)

        </label>

        <input

          id="purchaseCost"

          type="number"

          min="0"

          step="0.01"

          placeholder="0.00"

        >

        <label for="profileNotes">Additional Notes</label>

        <textarea

          id="profileNotes"

          placeholder="Add item details..."

        ></textarea>

        <div class="card" style="background:#f3f7f8">

          <strong>Total Inventory Value</strong>

          <p id="profileValue">$0.00</p>

        </div>

        <div class="profile-actions">

          <button class="primary" type="submit">

            Save Changes

          </button>

          <button

            class="danger"

            type="button"

            onclick="deleteItem()"

          >

            Delete Item

          </button>

        </div>

      </form>

    </div>

  </section>

</main>

<footer>

  Inventory App | Your information is saved on this device

</footer>

<script>

"use strict";

// LOCAL STORAGE

const STORAGE_KEY = "inventory_app_v1";

let inventory = loadInventory();

let activeItemId = null;

function loadInventory() {

  try {

    const saved = localStorage.getItem(STORAGE_KEY);

    const parsed = saved ? JSON.parse(saved) : [];

    return Array.isArray(parsed) ? parsed : [];

  } catch (error) {

    console.error("Unable to load inventory:", error);

    return [];

  }

}

function saveInventory() {

  try {

    localStorage.setItem(

      STORAGE_KEY,

      JSON.stringify(inventory)

    );

    return true;

  } catch (error) {

    alert(

      "Unable to save. Check browser storage settings."

    );

    return false;

  }

}

function money(amount) {

  return new Intl.NumberFormat("en-US", {

    style: "currency",

    currency: "USD"

  }).format(amount || 0);

}

function createId() {

  if (window.crypto && crypto.randomUUID) {

    return crypto.randomUUID();

  }

  return Date.now().toString() +

    Math.random().toString(36).slice(2);

}

function getItem(id) {

  return inventory.find(item => item.id === id);

}

// ADD INVENTORY

document.getElementById("addForm")

  .addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document

      .getElementById("newName")

      .value.trim();

    const quantity = Number(

      document.getElementById("newQuantity").value

    );

    if (

      !name ||

      !Number.isSafeInteger(quantity) ||

      quantity < 0

    ) {

      alert("Enter a valid name and whole-number quantity.");

      return;

    }

    const item = {

      id: createId(),

      name: name,

      quantity: quantity,

      purchaseDate: "",

      store: "",

      cost: 0,

      notes: ""

    };

    inventory.push(item);

    if (!saveInventory()) {

      inventory.pop();

      return;

    }

    document.getElementById("addForm").reset();

    document.getElementById("newQuantity").value = 1;

    renderInventory();

  });

// DISPLAY INVENTORY

function renderInventory() {

  const list = document.getElementById("inventoryList");

  const search = document

    .getElementById("searchInput")

    .value.toLowerCase();

  list.replaceChildren();

  const filtered = inventory.filter(item =>

    item.name.toLowerCase().includes(search)

  );

  if (filtered.length === 0) {

    const empty = document.createElement("p");

    empty.className = "empty";

    empty.textContent = inventory.length === 0

      ? "No inventory added yet."

      : "No matching inventory found.";

    list.appendChild(empty);

  }

  filtered.forEach(item => {

    const wrapper = document.createElement("div");

    wrapper.className = "inventory-item";

    const top = document.createElement("div");

    top.className = "item-top";

    const nameButton = document.createElement("button");

    nameButton.className = "item-name";

    nameButton.type = "button";

    nameButton.textContent = item.name;

    nameButton.addEventListener("click", () => {

      openProfile(item.id);

    });

    const controls = document.createElement("div");

    controls.className = "quantity-controls";

    const minus = document.createElement("button");

    minus.type = "button";

    minus.textContent = "−";

    minus.setAttribute(

      "aria-label",

      "Decrease quantity of " + item.name

    );

    minus.addEventListener("click", () => {

      changeQuantity(item.id, -1);

    });

    const count = document.createElement("strong");

    count.textContent = item.quantity;

    const plus = document.createElement("button");

    plus.type = "button";

    plus.textContent = "+";

    plus.setAttribute(

      "aria-label",

      "Increase quantity of " + item.name

    );

    plus.addEventListener("click", () => {

      changeQuantity(item.id, 1);

    });

    controls.append(minus, count, plus);

    top.append(nameButton, controls);

    const details = document.createElement("div");

    details.className = "item-details";

    details.textContent =

      "Value: " + money(item.quantity * item.cost);

    wrapper.append(top, details);

    list.appendChild(wrapper);

  });

  updateDashboard();

}

// QUANTITY TRACKING

function changeQuantity(id, change) {

  const item = getItem(id);

  if (!item) return;

  const oldQuantity = item.quantity;

  const nextQuantity = oldQuantity + change;

  if (

    nextQuantity < 0 ||

    !Number.isSafeInteger(nextQuantity)

  ) {

    return;

  }

  item.quantity = nextQuantity;

  if (!saveInventory()) {

    item.quantity = oldQuantity;

    return;

  }

  renderInventory();

}

// DASHBOARD TOTALS

function updateDashboard() {

  const totalItems = inventory.length;

  const totalUnits = inventory.reduce(

    (sum, item) => sum + item.quantity,

    0

  );

  const totalValue = inventory.reduce(

    (sum, item) =>

      sum + item.quantity * item.cost,

    0

  );

  document.getElementById("totalItems")

    .textContent = totalItems;

  document.getElementById("totalUnits")

    .textContent = totalUnits;

  document.getElementById("totalValue")

    .textContent = money(totalValue);

}

// OPEN PROFILE

function openProfile(id) {

  const item = getItem(id);

  if (!item) return;

  activeItemId = id;

  document.getElementById("profileName")

    .value = item.name;

  document.getElementById("profileQuantity")

    .value = item.quantity;

  document.getElementById("purchaseDate")

    .value = item.purchaseDate || "";

  document.getElementById("purchaseStore")

    .value = item.store || "";

  document.getElementById("purchaseCost")

    .value = item.cost || "";

  document.getElementById("profileNotes")

    .value = item.notes || "";

  updateProfileValue();

  document.getElementById("dashboard")

    .classList.add("hidden");

  document.getElementById("profilePage")

    .classList.remove("hidden");

  window.scrollTo(0, 0);

}

// PROFILE TOTAL VALUE

function updateProfileValue() {

  const quantity = Number(

    document.getElementById("profileQuantity").value

  ) || 0;

  const cost = Number(

    document.getElementById("purchaseCost").value

  ) || 0;

  document.getElementById("profileValue")

    .textContent = money(quantity * cost);

}

document.getElementById("profileQuantity")

  .addEventListener("input", updateProfileValue);

document.getElementById("purchaseCost")

  .addEventListener("input", updateProfileValue);

// SAVE PROFILE

document.getElementById("profileForm")

  .addEventListener("submit", function(event) {

    event.preventDefault();

    const item = getItem(activeItemId);

    if (!item) return;

    const name = document

      .getElementById("profileName")

      .value.trim();

    const quantity = Number(

      document.getElementById("profileQuantity").value

    );

    const costInput = document

      .getElementById("purchaseCost").value;

    const cost = costInput === ""

      ? 0

      : Number(costInput);

    if (

      !name ||

      !Number.isSafeInteger(quantity) ||

      quantity < 0 ||

      !Number.isFinite(cost) ||

      cost < 0

    ) {

      alert("Please enter valid inventory information.");

      return;

    }

    const previous = { ...item };

    item.name = name;

    item.quantity = quantity;

    item.purchaseDate = document

      .getElementById("purchaseDate").value;

    item.store = document

      .getElementById("purchaseStore")

      .value.trim();

    item.cost = cost;

    item.notes = document

      .getElementById("profileNotes")

      .value.trim();

    if (!saveInventory()) {

      Object.assign(item, previous);

      return;

    }

    showDashboard();

  });

// DELETE INVENTORY

function deleteItem() {

  const item = getItem(activeItemId);

  if (!item) return;

  const confirmed = confirm(

    'Delete "' + item.name + '" from inventory?'

  );

  if (!confirmed) return;

  const previousInventory = [...inventory];

  inventory = inventory.filter(

    record => record.id !== activeItemId

  );

  if (!saveInventory()) {

    inventory = previousInventory;

    return;

  }

  showDashboard();

}

// RETURN TO DASHBOARD

function showDashboard() {

  activeItemId = null;

  document.getElementById("profilePage")

    .classList.add("hidden");

  document.getElementById("dashboard")

    .classList.remove("hidden");

  renderInventory();

  window.scrollTo(0, 0);

}

// SEARCH

document.getElementById("searchInput")

  .addEventListener("input", renderInventory);

// INITIAL DISPLAY

renderInventory();

</script>

</body>

</html>
